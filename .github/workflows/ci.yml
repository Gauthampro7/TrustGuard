name: Module checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modules-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ownership:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check assigned paths using integration policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python scripts/check_ownership.py --base "$BASE_SHA" --branch "$HEAD_BRANCH"

  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - run: python -m pip install -r backend/requirements.txt -c backend/constraints.txt
      - run: python scripts/check_module.py core

  forensics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - run: python -m pip install -r backend/requirements.txt -c backend/constraints.txt
      - run: python scripts/check_module.py forensics

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extension syntax
        run: |
          node --check extension/content.js
          node --check extension/background.js
          node --check extension/verdict-ui.js
          node --check extension/popup/popup.js
      - run: node --test extension/tests/*.test.cjs

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r backend/requirements.txt -c backend/constraints.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check frontend/app.js
      - name: Start local API and run the real browser suite
        shell: bash
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/trustguard-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          python scripts/check_module.py dashboard --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-smoke
          path: scratch/dashboard-smoke/
          if-no-files-found: ignore
